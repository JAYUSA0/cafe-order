<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>단체주문 메모</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="단체주문">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@500;600;700&display=swap">
<style>
/* Layout: one-column phone tool, four views switched from a fixed bottom tab bar */
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F4EF; --surface:#FFFFFF; --ink:#0F1411; --muted:#3E4641; --line:#BCC6BA;
  --accent:#1F6E5C; --accent-ink:#FFFFFF; --accent-soft:#DCEBE5;
  --ice:#2D6FA8; --ice-soft:#E1ECF6; --hot:#B5502A; --hot-soft:#F6E4DA;
  --danger:#A8322A; color-scheme:light;
  --name-soft:#DFE9E3; --opt:#7A4A00; --opt-soft:#FFF3D6; --opt-line:#E3BE6E; --opt-on:#F2B437; --menu-line:#9FB6AB;
  --f-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;font-weight:500;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:76px calc(90px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:2px 8px}
h1{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0;letter-spacing:-.01em}
.tally{font-family:var(--f-display);font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.tally b{font-weight:400;color:var(--accent);font-size:22px}
h2{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;text-transform:uppercase}
section{margin-bottom:16px}
.hint{color:var(--muted);font-size:13px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:15px;display:inline-flex;align-items:center;gap:6px;min-height:42px;transition:background .12s,border-color .12s}
.chip.person[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip.person.done:not([aria-pressed="true"]){color:var(--muted);background:var(--surface);border-color:var(--line)}
.badge{font-size:11px;font-weight:600;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:inline-grid;place-items:center;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .badge{background:var(--accent-ink);color:var(--accent)}
.chip.person{background:var(--name-soft);border-color:transparent;padding:4px 10px;font-size:14px;font-weight:600;min-height:32px;gap:4px}
#peopleChips{gap:6px}
.mine{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;padding:8px 10px;background:var(--accent-soft);border-radius:10px}
.mine .pill{background:var(--surface)}
.chip.small{min-height:34px;padding:5px 11px;font-size:14px;font-weight:600;border-radius:6px;background:var(--opt-soft);border-color:var(--opt-line);color:var(--opt)}
.chip.small[aria-pressed="true"]{background:var(--opt-on);border-color:var(--opt-on);color:#2E1D00;font-weight:700}
.menu-grid{display:flex;flex-wrap:wrap;gap:6px}
.menu-btn{border:1.5px solid var(--menu-line);background:var(--surface);border-radius:12px;box-shadow:0 2px 0 var(--menu-line);padding:7px 12px;text-align:center;min-height:38px;font-size:15px;font-weight:600;white-space:nowrap}
.menu-btn:active{background:var(--accent-soft)}
.menu-btn.add{border-style:dashed;color:var(--muted);font-weight:400}
.locked .menu-btn{opacity:.45}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:8px 14px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{font-weight:700}
.seg button[data-t="ICE"]{color:var(--ice)}
.seg button[aria-pressed="true"][data-t="ICE"]{background:var(--ice);color:#fff}
.seg button[data-t="HOT"]{color:var(--hot)}
.seg button[aria-pressed="true"][data-t="HOT"]{background:var(--hot);color:#fff}
.seg button[aria-pressed="true"][data-t=""]{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;flex:1 1 140px}
.t{font-size:12px;font-weight:700;padding:1px 6px;border-radius:5px;margin-right:4px}
.t.ICE{background:var(--ice-soft);color:var(--ice)}
.t.HOT{background:var(--hot-soft);color:var(--hot)}
.opt{color:var(--opt);font-size:13px;font-weight:600}
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .name{font-weight:700}
.item .who{color:var(--muted);font-size:14px;margin-top:2px;word-break:keep-all}
.count{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--accent);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 4px 4px 8px;font-size:14px}
.x{border:0;background:none;color:var(--muted);width:26px;height:26px;border-radius:6px;font-size:16px;line-height:1;display:grid;place-items:center}
.x:hover{background:var(--line)}
.missing{margin-top:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;padding:12px;border-radius:12px;background:var(--hot-soft)}
.confirm p{margin:0;flex:1 1 100%;font-size:14px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:19px;margin-bottom:4px}
textarea.copybox{width:100%;min-height:140px;font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:10px}
nav{position:fixed;left:0;right:0;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:none;padding:8px 4px 9px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button[aria-current="page"]{color:var(--accent);font-weight:600}
nav button[aria-current="page"]::before{content:"";position:absolute;bottom:0;left:25%;right:25%;height:3px;border-radius:3px 3px 0 0;background:var(--accent)}
nav .num{font-family:var(--f-display);font-size:18px;line-height:1.1;font-weight:400;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--ink);color:var(--bg);padding:10px 8px 10px 14px;border-radius:12px;display:flex;align-items:center;gap:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.18)}
.toast button{border:0;background:none;color:var(--bg);font-weight:600;text-decoration:underline;padding:4px 6px}
.src{font-size:12px;color:var(--muted);margin-top:18px}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.nudge{animation:nudge .25s 2}
@media (prefers-reduced-motion:reduce){.nudge{animation:none}.chip{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>단체주문 메모</h1>
    <div class="tally"><b id="total">0</b> 잔</div>
  </header>
  <main id="view"></main>
</div>

<div class="toast" id="toast" hidden><span id="toastMsg"></span><button id="toastUndo" type="button">되돌리기</button></div>

<nav aria-label="화면">
  <div class="in">
    <button type="button" data-view="take" aria-current="page"><span class="num">+</span>주문받기</button>
    <button type="button" data-view="menu"><span class="num" id="navMenu">0</span>메뉴별</button>
    <button type="button" data-view="people"><span class="num" id="navPeople">0</span>사람별</button>
    <button type="button" data-view="edit"><span class="num">≡</span>명단·메뉴</button>
  </div>
</nav>

<script>
(function(){
  const LS_KEY = "cafe-order-v1";
  /* 기본 명단·메뉴: 바꾸면 DEFAULTS_VERSION 숫자를 올려야 모든 폰에 새로 반영돼요 */
  const DEFAULTS_VERSION = 2;
  const DEFAULT_PEOPLE = ["이종덕","이종진","길종성","김보래","김영선","장윤정","차지현","최은주","김성민","안선미","이상훈","방재현","윤재상","손인선"];
  const DEFAULT_MENUS = ["아메리카노","카페라떼","바닐라라떼","카라멜마키아토","카페모카","카푸치노","콜드브루","녹차라떼","초코라떼","밀크티","자몽에이드","레몬에이드","복숭아아이스티","캐모마일","유자차"];
  const QUICK_OPTS = ["연하게","샷추가","덜 달게","얼음 적게","디카페인"];
  const S = { people: [], menus: [], orders: [], mode: "local", ready: false };
  const UI = { confirmReset: false, view: "take", sel: null, temp: "ICE", opt: "", adding: false, confirmClear: false, copyText: null, lastAdded: null };
  let db = null;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const tempWord = (t) => t === "ICE" ? "아이스" : t === "HOT" ? "핫" : "";

  /* ---------- storage ---------- */
  function loadLocal(){
    try{
      const raw = localStorage.getItem(LS_KEY);
      const d = raw ? JSON.parse(raw) : {};
      const fresh = d.v !== DEFAULTS_VERSION;
      S.people = (!fresh && Array.isArray(d.people)) ? d.people : DEFAULT_PEOPLE.slice();
      S.menus = (!fresh && Array.isArray(d.menus)) ? d.menus : DEFAULT_MENUS.slice();
      S.orders = Array.isArray(d.orders) ? d.orders : [];
      if(fresh) saveLocal();
    }catch(e){ S.people = DEFAULT_PEOPLE.slice(); S.menus = DEFAULT_MENUS.slice(); }
  }
  function saveLocal(){
    try{ localStorage.setItem(LS_KEY, JSON.stringify({v:DEFAULTS_VERSION, people:S.people, menus:S.menus, orders:S.orders})); }catch(e){}
  }
  const queues = {};
  function writeSerial(key, fn){
    queues[key] = (queues[key] || Promise.resolve()).then(fn).catch(failed);
    return queues[key];
  }
  function failed(e){
    const code = e && e.code;
    showToast(code === "quota_exceeded" ? "저장 공간이 찼어요. 지난 주문을 지워주세요." : "저장하지 못했어요. 잠시 후 다시 눌러주세요.", false);
  }

  async function setPeople(names){
    S.people = names; render();
    if(S.mode === "db") writeSerial("people", () => db.doc("config/people").set({names}));
    else saveLocal();
  }
  async function setMenus(items){
    S.menus = items; render();
    if(S.mode === "db") writeSerial("menus", () => db.doc("config/menus").set({items}));
    else saveLocal();
  }
  function addOrder(person, menu){
    const o = { person, menu, temp: UI.temp, opt: UI.opt.trim(), at: Date.now() };
    let id;
    if(S.mode === "db"){
      const ref = db.collection("orders").doc(); id = ref.id;
      S.orders = S.orders.concat([{id, ...o}]);
      ref.set(o).catch(failed);
    } else {
      id = "o" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
      S.orders.push({id, ...o}); saveLocal();
    }
    return id;
  }
  function removeOrder(id){
    S.orders = S.orders.filter(o => o.id !== id);
    if(S.mode === "db") db.doc("orders/" + id).delete().catch(failed);
    else saveLocal();
  }
  async function clearOrders(){
    const ids = S.orders.map(o => o.id);
    S.orders = []; render();
    if(S.mode === "db"){
      for(const id of ids){ try{ await db.doc("orders/" + id).delete(); }catch(e){ failed(e); break; } }
    } else saveLocal();
  }

  /* ---------- derived ---------- */
  function byMenu(){
    const g = new Map();
    for(const o of S.orders){
      const key = (o.temp||"") + "|" + o.menu + "|" + (o.opt||"");
      if(!g.has(key)) g.set(key, {temp:o.temp||"", menu:o.menu, opt:o.opt||"", who:[]});
      g.get(key).who.push(o.person);
    }
    return [...g.values()].sort((a,b) => b.who.length - a.who.length || a.menu.localeCompare(b.menu, "ko"));
  }
  function byPerson(){
    const g = new Map();
    for(const p of S.people) g.set(p, []);
    for(const o of S.orders){ if(!g.has(o.person)) g.set(o.person, []); g.get(o.person).push(o); }
    return g;
  }
  function countFor(p){ return S.orders.filter(o => o.person === p).length; }
  function label(x){ return (x.temp ? tempWord(x.temp) + " " : "") + x.menu + (x.opt ? " (" + x.opt + ")" : ""); }
  function tag(t){ return t ? `<span class="t ${t}">${tempWord(t)}</span>` : ""; }

  /* ---------- views ---------- */
  function vTake(){
    if(!S.people.length){
      return `<div class="empty"><strong>먼저 명단을 넣어주세요</strong>자주 같이 가는 사람 이름을 한 번만 넣어두면 다음부턴 누르기만 하면 돼요.<div class="actions" style="justify-content:center"><button class="btn primary" data-act="go" data-v="edit" type="button">명단 넣기</button></div></div>`;
    }
    const people = S.people.map(p => {
      const n = countFor(p);
      return `<button type="button" class="chip person${n?" done":""}" data-act="pick" data-p="${esc(p)}" aria-pressed="${UI.sel===p}">${esc(p)}${n?`<span class="badge">${n}</span>`:""}</button>`;
    }).join("");
    const segBtn = (t, txt) => `<button type="button" data-act="temp" data-t="${t}" aria-pressed="${UI.temp===t}">${txt}</button>`;
    const menus = S.menus.map(m => `<button type="button" class="menu-btn" data-act="order" data-m="${esc(m)}">${esc(m)}</button>`).join("");
    const left = S.people.filter(p => !countFor(p)).length;
    const mine = UI.sel ? S.orders.filter(o => o.person === UI.sel) : [];
    const mineHtml = mine.length ? `<div class="mine"><span class="hint">이미 주문</span>${mine.map(o => `<span class="pill">${tag(o.temp)}${esc(o.menu)}${o.opt?` <span class="opt">${esc(o.opt)}</span>`:""}<button type="button" class="x" data-act="del" data-id="${esc(o.id)}" aria-label="${esc(o.menu)} 주문 취소">×</button></span>`).join("")}</div>` : "";
    return `
      <section>
        <h2>누가</h2>
        <div class="chips" id="peopleChips">${people}</div>
        <p class="hint" style="margin-top:8px">${left ? `아직 안 고른 사람 ${left}명` : "모두 주문했어요"}</p>
      </section>
      <section class="${UI.sel ? "" : "locked"}" id="menuSec">
        <h2>${UI.sel ? esc(UI.sel) + " 님은" : "뭘 마실지"}</h2>
        ${mineHtml}
        <p class="lbl">온도 · 옵션</p>
        <div class="row">
          <div class="seg" role="group" aria-label="온도">${segBtn("ICE","아이스")}${segBtn("HOT","핫")}${segBtn("","선택 안 함")}</div>
          <input type="text" id="optInput" placeholder="옵션 직접 입력" value="${esc(UI.opt)}" autocomplete="off">
        </div>
        <div class="chips" style="margin-bottom:12px" role="group" aria-label="자주 쓰는 옵션">${QUICK_OPTS.map(o => `<button type="button" class="chip small" data-act="opt" data-o="${esc(o)}" aria-pressed="${splitList(UI.opt).includes(o)}">${esc(o)}</button>`).join("")}</div>
        <p class="lbl">메뉴</p>
        <div class="menu-grid">${menus}
          ${UI.adding
            ? `<form id="addMenuForm" style="flex:1 1 100%;display:flex;gap:8px"><input type="text" id="newMenu" placeholder="메뉴 이름" autocomplete="off"><button class="btn primary" type="submit">추가</button></form>`
            : `<button type="button" class="menu-btn add" data-act="addmenu">+ 직접 입력</button>`}
        </div>
        <p class="hint" id="menuHint" style="margin-top:8px">${UI.sel ? "메뉴를 누르면 바로 기록되고, 다음 사람으로 넘어가요." : "위에서 이름을 먼저 골라주세요."}</p>
      </section>`;
  }

  function vMenu(){
    if(!S.orders.length) return emptyOrders();
    const groups = byMenu();
    const rows = groups.map(g => `<div class="item"><div class="count">${g.who.length}</div><div class="main"><div class="name">${tag(g.temp)}${esc(g.menu)}${g.opt?` <span class="opt">· ${esc(g.opt)}</span>`:""}</div><div class="who">${g.who.map(esc).join(", ")}</div></div></div>`).join("");
    return `<section><h2>카운터에서 이대로 주문</h2><div class="list">${rows}</div>${tools()}</section>`;
  }

  function vPeople(){
    if(!S.orders.length) return emptyOrders();
    const g = byPerson(); const ordered = []; const missing = [];
    for(const [p, list] of g){ (list.length ? ordered : missing).push([p, list]); }
    const rows = ordered.map(([p, list]) => `<div class="item"><div class="main"><div class="name">${esc(p)}</div><div class="pills">${list.map(o => `<span class="pill">${tag(o.temp)}${esc(o.menu)}${o.opt?` <span class="opt">${esc(o.opt)}</span>`:""}<button type="button" class="x" data-act="del" data-id="${esc(o.id)}" aria-label="${esc(p)} ${esc(o.menu)} 지우기">×</button></span>`).join("")}</div></div></div>`).join("");
    const miss = missing.length ? `<div class="missing"><h2>아직 안 시킨 사람</h2><div class="chips">${missing.map(([p]) => `<button type="button" class="chip" data-act="pickgo" data-p="${esc(p)}">${esc(p)}</button>`).join("")}</div></div>` : "";
    return `<section><h2>사람별 주문</h2><div class="list">${rows}</div>${miss}${tools()}</section>`;
  }

  function emptyOrders(){
    return `<div class="empty"><strong>아직 받은 주문이 없어요</strong>주문받기에서 이름과 메뉴를 누르면 여기에 모여요.<div class="actions" style="justify-content:center"><button class="btn primary" data-act="go" data-v="take" type="button">주문받기</button></div></div>`;
  }

  function tools(){
    let html = `<div class="actions"><button type="button" class="btn primary" data-act="copy">카톡용으로 복사</button><button type="button" class="btn danger" data-act="askclear">새 주문 시작</button></div>`;
    if(UI.confirmClear) html += `<div class="confirm"><p>지금까지 받은 주문 ${S.orders.length}개를 모두 지울까요? 명단과 메뉴는 그대로 남아요.</p><button type="button" class="btn danger" data-act="clear">모두 지우기</button><button type="button" class="btn" data-act="noclear">취소</button></div>`;
    if(UI.copyText !== null) html += `<textarea class="copybox" id="copyBox" readonly>${esc(UI.copyText)}</textarea><p class="hint">자동 복사가 막혀서 글을 펼쳐뒀어요. 길게 눌러 복사하세요.</p>`;
    return html;
  }

  function vEdit(){
    const list = (arr, kind) => arr.length
      ? `<div class="chips">${arr.map((x,i) => `<span class="pill" style="font-size:15px">${esc(x)}<button type="button" class="x" data-act="rm-${kind}" data-i="${i}" aria-label="${esc(x)} 빼기">×</button></span>`).join("")}</div>`
      : `<p class="hint">아직 없어요.</p>`;
    return `
      <section>
        <h2>명단 · ${S.people.length}명</h2>
        ${list(S.people, "p")}
        <form id="addPeopleForm" class="row" style="margin-top:10px"><input type="text" id="newPeople" placeholder="이름 (쉼표로 여러 명)" autocomplete="off"><button class="btn primary" type="submit">추가</button></form>
        ${UI.confirmReset
          ? `<div class="confirm"><p>명단과 메뉴를 처음 기본값으로 되돌릴까요? 받은 주문은 그대로 남아요.</p><button type="button" class="btn danger" data-act="reset">되돌리기</button><button type="button" class="btn" data-act="noreset">취소</button></div>`
          : `<div class="actions"><button type="button" class="btn" data-act="askreset">기본 명단·메뉴로 되돌리기</button></div>`}
      </section>
      <section>
        <h2>메뉴 · ${S.menus.length}개</h2>
        ${list(S.menus, "m")}
        <form id="addMenusForm" class="row" style="margin-top:10px"><input type="text" id="newMenus" placeholder="메뉴 (쉼표로 여러 개)" autocomplete="off"><button class="btn primary" type="submit">추가</button></form>
        <p class="hint">아이스/핫은 주문할 때 고르니 메뉴엔 이름만 넣으면 돼요.</p>
      </section>
      <p class="src">명단·메뉴·주문은 이 폰의 브라우저에 저장돼요. 다른 폰과는 공유되지 않아요.</p>`;
  }

  function render(){
    const views = {take:vTake, menu:vMenu, people:vPeople, edit:vEdit};
    const optFocused = document.activeElement && document.activeElement.id === "optInput";
    $("view").innerHTML = (S.mode === "db" && !S.ready) ? `<p class="hint">불러오는 중…</p>` : views[UI.view]();
    $("total").textContent = S.orders.length;
    $("navMenu").textContent = byMenu().length;
    $("navPeople").textContent = new Set(S.orders.map(o => o.person)).size;
    document.querySelectorAll("nav button").forEach(b => { if(b.dataset.view === UI.view) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
    const nm = $("newMenu"); if(nm) nm.focus();
    if(optFocused && $("optInput")){ const i = $("optInput"); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }

  /* ---------- toast ---------- */
  let toastTimer;
  function showToast(msg, undo){
    $("toastMsg").textContent = msg; $("toastUndo").hidden = !undo; $("toast").hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { $("toast").hidden = true; }, 3500);
  }
  $("toastUndo").addEventListener("click", () => {
    if(UI.lastAdded){ const {id, person} = UI.lastAdded; removeOrder(id); UI.sel = person; UI.lastAdded = null; render(); }
    $("toast").hidden = true;
  });

  /* ---------- copy ---------- */
  function summaryText(){
    const lines = byMenu().map(g => `${label(g)} ${g.who.length} (${g.who.join(", ")})`);
    lines.push("", `총 ${S.orders.length}잔`);
    return lines.join("\n");
  }

  /* ---------- events ---------- */
  function splitList(s){ return s.split(/[,，\n]/).map(x => x.trim()).filter(Boolean); }
  function nextPerson(after){
    const i = S.people.indexOf(after);
    const order = S.people.slice(i+1).concat(S.people.slice(0, i+1));
    return order.find(p => !countFor(p)) || null;
  }

  document.addEventListener("click", (e) => {
    const nb = e.target.closest("nav button");
    if(nb){ UI.view = nb.dataset.view; UI.confirmClear = false; UI.confirmReset = false; UI.copyText = null; UI.adding = false; render(); window.scrollTo(0,0); return; }
    const b = e.target.closest("[data-act]"); if(!b) return;
    const act = b.dataset.act;
    if(act === "go"){ UI.view = b.dataset.v; render(); }
    else if(act === "pick"){ UI.sel = UI.sel === b.dataset.p ? null : b.dataset.p; render(); }
    else if(act === "pickgo"){ UI.sel = b.dataset.p; UI.view = "take"; render(); window.scrollTo(0,0); }
    else if(act === "temp"){ UI.temp = b.dataset.t; render(); }
    else if(act === "opt"){
      const o = b.dataset.o; let parts = splitList(UI.opt);
      parts = parts.includes(o) ? parts.filter(x => x !== o) : parts.concat([o]);
      UI.opt = parts.join(", "); render();
    }
    else if(act === "order"){
      if(!UI.sel){ const h = $("peopleChips"); h.classList.remove("nudge"); void h.offsetWidth; h.classList.add("nudge"); return; }
      const person = UI.sel, menu = b.dataset.m;
      const shown = label({temp:UI.temp, menu, opt:UI.opt.trim()});
      const id = addOrder(person, menu);
      UI.lastAdded = {id, person}; UI.opt = "";
      UI.sel = nextPerson(person);
      render();
    }
    else if(act === "addmenu"){ UI.adding = true; render(); }
    else if(act === "del"){ removeOrder(b.dataset.id); render(); if(UI.view === "take") showToast("주문을 취소했어요", false); }
    else if(act === "rm-p"){ const a = S.people.slice(); a.splice(+b.dataset.i,1); if(UI.sel && !a.includes(UI.sel)) UI.sel = null; setPeople(a); }
    else if(act === "rm-m"){ const a = S.menus.slice(); a.splice(+b.dataset.i,1); setMenus(a); }
    else if(act === "askreset"){ UI.confirmReset = true; render(); }
    else if(act === "noreset"){ UI.confirmReset = false; render(); }
    else if(act === "reset"){ UI.confirmReset = false; S.people = DEFAULT_PEOPLE.slice(); S.menus = DEFAULT_MENUS.slice(); saveLocal(); render(); showToast("기본 명단·메뉴로 되돌렸어요", false); }
    else if(act === "askclear"){ UI.confirmClear = true; render(); }
    else if(act === "noclear"){ UI.confirmClear = false; render(); }
    else if(act === "clear"){ UI.confirmClear = false; UI.copyText = null; UI.sel = S.people[0] || null; clearOrders(); showToast("새 주문을 시작해요", false); }
    else if(act === "copy"){
      const text = summaryText();
      const fallback = () => { UI.copyText = text; render(); const box = $("copyBox"); if(box){ box.focus(); box.select(); } };
      try{
        navigator.clipboard.writeText(text).then(() => { UI.copyText = null; render(); showToast("복사했어요. 카톡에 붙여넣으세요.", false); }, fallback);
      }catch(err){ fallback(); }
    }
  });

  document.addEventListener("input", (e) => { if(e.target.id === "optInput") UI.opt = e.target.value; });

  document.addEventListener("submit", (e) => {
    e.preventDefault();
    const f = e.target;
    if(f.id === "addMenuForm"){
      const v = $("newMenu").value.trim(); UI.adding = false;
      if(v && !S.menus.includes(v)) setMenus(S.menus.concat([v])); else render();
    } else if(f.id === "addPeopleForm"){
      const add = splitList($("newPeople").value).filter(x => !S.people.includes(x));
      if(add.length) setPeople(S.people.concat(add));
      $("newPeople").value = ""; $("newPeople").focus();
    } else if(f.id === "addMenusForm"){
      const add = splitList($("newMenus").value).filter(x => !S.menus.includes(x));
      if(add.length) setMenus(S.menus.concat(add));
      $("newMenus").value = ""; $("newMenus").focus();
    }
  });

  /* ---------- boot ---------- */
  function init(){ loadLocal(); render(); }
  init();
  if("serviceWorker" in navigator){ window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); }); }
})();
</script>
</body>
</html>
